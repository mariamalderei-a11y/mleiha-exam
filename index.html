ound:#fff0f0;color:#a83e3e}.flag-btn{min-height:32px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-size:10px;font-weight:800}.flag-btn.on{background:#fff6e5;border-color:#efd49a;color:#986515}.qtext{max-width:830px;margin:0 0 23px;font-size:clamp(20px,2.7vw,29px);line-height:1.55}.options{display:grid;gap:10px;max-width:820px}.option{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:#fcfdff;cursor:pointer;transition:.18s}.option:hover,.option.selected{border-color:#8797ef;background:var(--soft)}.option input{position:absolute;opacity:0}.letter{display:grid;place-items:center;width:33px;height:33px;flex:0 0 33px;border-radius:9px;background:#f1f4f9;color:var(--muted);font-weight:900;font-size:11px}.selected .letter{background:var(--blue);color:#fff}.option span:last-child{font-size:14px;font-weight:700}.qbottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:31px;padding-top:17px;border-top:1px solid var(--line)}.save{color:var(--muted);font-size:9px}.nav-buttons{display:flex;gap:7px}.nav-btn{min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:11px;font-weight:800}.nav-btn.next{background:var(--blue);border-color:var(--blue);color:#fff}.nav-btn:disabled{opacity:.4;cursor:not-allowed}.modal-bg{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:#13203b77;backdrop-filter:blur(4px)}.modal{width:min(510px,100%);max-height:90vh;overflow:auto;padding:23px;border-radius:21px;background:#fff;box-shadow:0 25px 70px #13203b3d}.modal h3{margin:0 0 7px;font-size:20px}.modal p{margin:0;color:var(--muted);font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:19px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}.summary div{padding:10px;border-radius:11px;b <body><div id="app"></div>
<script>
"use strict";
const DATA=[{"id":"mleiha","title":"مليحة والمنطقة العربية","text":"بُنيت قرية مليحة حوالي عام 250 قبل الميلاد، في بداية حقبة ما قبل الإسلام في الإمارات. وتضم المنطقة بقايا مبانٍ ومقابر تكشف عن مجتمع نشط عرف التجارة والزراعة وصناعة المعادن. كانت المقابر الأولى تتألف من حجرة واحدة محفورة في الأرض، وكان سقفها يقوم على عوارض خشبية، وقد عُثر على العديد منها في مليحة. ومع مرور الوقت ظهرت مقابر برجية مزينة بزخارف مدرجة، تشبه بعض المقابر في البتراء ومدائن صالح، مما يشير إلى علاقات متزايدة بين الإمارات والمنطقة العربية. كما عُثر على نقش مكتوب بالأبجدية العربية الجنوبية، وهو دليل على التواصل الثقافي والتجاري. وتشير طريقة الدفن وعدد الهياكل العظمية القليل في بعض الحجرات إلى أن الجثمان ربما كان يوضع فترة خارج الحجرة قبل جمع العظام ودفنها.","questions":[{"level":"سهل","key":"easy","q":"متى بُنيت قرية مليحة تقريباً؟","o":["حوالي 250 ق.م.","حوالي 250 م.","حوالي 2000 ق.م.","حوالي 1600 م."]},{"level":"سهل","key":"easy","q":"في أي حقبة بُنيت قرية مليحة؟","o":["العصر الحديث","حقبة ما قبل الإسلام","العصر الإسلامي المتأخر","العصر الروماني فقط"]},{"level":"سهل","key":"easy","q":"كم حجرة كانت تتألف منها المقابر الأولى؟","o":["حجرة واحدة","حجرتان","ثلاث حجرات","خمس حجرات"]},{"level":"سهل","key":"easy","q":"على ماذا كان يقوم سقف المقابر الأولى؟","o":["أعمدة معدنية","عوارض خشبية","قباب زجاجية","ألواح رخامية"]},{"level":"سهل","key":"easy","q":"أين عُثر على العديد من هذه المقابر؟","o":["مليحة","تدمر","البتراء","مدائن صالح"]},{"level":"متوسط","key":"medium","q":"إلى أي موقعين شُبّهت زخارف المقابر البرجية؟","o":["تدمر ومكة","البتراء ومدائن صالح","وادي سوق والعين","مصر وبلاد الرافدين"]},{"level":"متوسط","key":"medium","q":"ماذا تشير أوجه الشبه بين المقابر إلى؟","o":["عزلة مليحة","علاقات متزايدة مع المنطقة العربية","حداثة المقابر","اختلاف الثقافات"]},{"level":"متوسط","key":"medium","q":"بأي نوع من الكتابة كُتب النقش؟","o":["الأبجدية العربية الجنوبية","الأبجدية اللاتينية","الخط المسماري","الرموز الفرعونية"]},{"level":"متوسط","key":"medium","q":"ما التفسير الأقرب لقلة الهياكل العظمية في بعض الحجرات؟","o":["لم تكن مقابر","ربما وُضع الجثمان خارج الحجرة أولاً","كانت الحجرات مغمورة بالماء","كانت مخصصة للتخزين"]},{"level":"متوسط","key":"medium","q":"ما النشاط الذي يكشفه ازدهار مليحة إلى جانب الدفن؟","o":["التجارة وصناعة المعادن","صيد الحيتان فقط","الزراعة الحديثة","صناعة الورق"]},{"level":"صعب","key":"hard","q":"إذا كان طول البرج 2م وعرضه 4.25م، فما محيط قاعدته؟","o":["6.25م","8.5م","12.5م","17م"]},{"level":"صعب","key":"hard","q":"إذا كان البرج متوازي مستطيلات بأبعاد 2م و4.25م و3.5م، فما حجمه؟","o":["9.75م³","14.875م³","29.75م³","42.5م³"]},{"level":"صعب","key":"hard","q":"أي استنتاج يجمع بين النقش والزخارف؟","o":["كانت مليحة معزولة","كان هناك تواصل ثقافي وتجاري مع مناطق أخرى","لم تعرف مليحة الكتابة","كل المقابر بُنيت في العصر الحديث"]},{"level":"صعب","key":"hard","q":"لماذا يعد عدد الهياكل العظمية دليلاً مهماً للباحثين؟","o":["يساعد في فهم طقوس الدفن","يثبت أن المباني كانت مساكن","يحدد لون الصخور","يثبت وجود الزراعة فقط"]},{"level":"صعب","key":"hard","q":"أي ترتيب زمني هو الأقرب لما ورد في النص؟","o":["المقابر البرجية ثم بناء القرية ثم النقش","بناء القرية ثم المقابر الأولى ثم تطور المقابر البرجية","النقش ثم بناء القرية ثم العصر الحديث","العصر الحديث ثم المقابر الأولى"]}]},{"id":"islam","title":"الإسلام في شبه الجزيرة العربية","text":"في مطلع القرن السابع الميلادي شهدت شبه الجزيرة العربية تغييرات مهمة، كان أبرزها تأسيس نظام ديني واجتماعي جديد وفق تعاليم الدين الإسلامي الذي أرسى دعائمه رسولنا محمد صلى الله عليه وسلم، ليحل مكان النظام القديم. وقد بدأ المسلمون في نشر الدعوة في أنحاء الجزيرة العربية، وكان من نتائج ذلك توحيد جماعات وقبائل كثيرة تحت نظام جديد. توفي النبي صلى الله عليه وسلم في المدينة المنورة عام 11هـ، وبدأ أبو بكر الصديق رضي الله عنه جمع القبائل التي ارتدت بعد وفاة النبي وإعادة توحيدها على الإسلام. وفي عام 632م أرسل النبي محمد صلى الله عليه وسلم رسوله عمرو بن العاص إلى جيفر وعبد ابني الجلندي، وكانا حاكمين على عُمان، فأسلما وأسلم أهل عُمان. وتوضح هذه الأحداث انتقال المنطقة من نظم قديمة متفرقة إلى مجتمع يجمعه الدين والنظام الاجتماعي الجديد.","questions":[{"level":"سهل","key":"easy","q":"متى شهدت شبه الجزيرة العربية التغييرات المذكورة؟","o":["مطلع القرن السابع الميلادي","القرن الثاني الميلادي","القرن التاسع الميلادي","العصر الحديث"]},{"level":"سهل","key":"easy","q":"من أرسى دعائم النظام الإسلامي؟","o":["عمرو بن العاص","أبو بكر الصديق","النبي محمد صلى الله عليه وسلم","جيفر الجلندي"]},{"level":"سهل","key":"easy","q":"في أي مدينة توفي النبي صلى الله عليه وسلم؟","o":["مكة","المدينة المنورة","صحار","جلفار"]},{"level":"سهل","key":"easy","q":"من بدأ جمع القبائل بعد وفاة النبي؟","o":["أبو بكر الصديق","عمرو بن العاص","جيفر الجلندي","الجلندي بن مسعود"]},{"level":"سهل","key":"easy","q":"إلى من أُرسل عمرو بن العاص؟","o":["إلى ملوك الأنباط","إلى جيفر وعبد ابني الجلندي","إلى تجار جلفار","إلى قادة البرتغاليين"]},{"level":"متوسط","key":"medium","q":"لماذا جمع أبو بكر القبائل بعد وفاة النبي؟","o":["لإعادة توحيد القبائل على الإسلام","لبناء حصن جديد","لإدارة التجارة البحرية","لجمع الضرائب فقط"]},{"level":"متوسط","key":"medium","q":"ما نتيجة إرسال عمرو بن العاص إلى عُمان؟","o":["رفض أهلها الدعوة","أسلم الحاكمان وأهل عُمان","انتقل السكان إلى جلفار","بدأت مقاومة البرتغاليين"]},{"level":"متوسط","key":"medium","q":"ما العلاقة بين انتشار الإسلام وتوحيد القبائل؟","o":["الإسلام قدم نظاماً مشتركاً جمع جماعات كثيرة","الإسلام ألغى التجارة","التوحيد أدى إلى بناء المقابر","لا توجد علاقة"]},{"level":"متوسط","key":"medium","q":"ما المقصود بانتقال المنطقة إلى مجتمع جديد؟","o":["الانتقال من نظم متفرقة إلى نظام ديني واجتماعي جامع","الانتقال من البحر إلى الصحراء","تغيير مواد البناء","توقف الزراعة"]},{"level":"متوسط","key":"medium","q":"ما التاريخ الميلادي الموافق لعام 11هـ في النص؟","o":["571م","622م","632م","1624م"]},{"level":"صعب","key":"hard","q":"أي استنتاج يفسر أهمية هذه الأحداث تاريخياً؟","o":["أن التغيير كان دينياً فقط دون أثر اجتماعي","أن الدعوة ساعدت في بناء وحدة اجتماعية وسياسية","أن عُمان كانت معزولة تماماً","أن القبائل لم تتغير"]},{"level":"صعب","key":"hard","q":"أي ترتيب للأحداث هو الأدق؟","o":["وفاة النبي ثم تأسيس الدعوة ثم إرسال عمرو","تأسي الحصن البرتقالي في البدّية","text":"رغم أن المصادر التاريخية تشير إلى وجود حصن برتقالي على الساحل الشرقي للإمارات، إلا أن العثور على أنقاض ذلك الحصن لم يكن سهلاً. في عام 1999م اكتشف علماء الآثار بقايا أحد الحصون التي بناها البرتغاليون. قام العلماء بالتنقيب على أنقاض أبنية كبيرة مربعة الشكل تصل حدودها إلى نحو 60 متراً، كما عثروا على أبراج عالية تشهد بعض أجزائها دماراً جزئياً بفعل الجرّافات وأعمال البناء الحديثة. ويعتقد بعض العلماء أن هذه الأبنية كانت من صفات تلك الحصون البرتغالية. وتبين المصادر التاريخية أن تاريخ الإشعاع الكربوني يشير إلى الفترة الزمنية التي تحتاج إليها المواد العضوية حتى تتحلل، ويبدو أن القلعة ليست من البرتغاليين، بل ربما كانت مستودعاً لمواد البناء مستوردة من مكان آخر. يؤكد علماء الآثار أن ذلك البناء كان ذا أهمية، وربما ستكشف أعمال التنقيب معرفة ذلك على وجه اليقين.","questions":[{"level":"سهل","key":"easy","q":"أين يقع الحصن البرتقالي المذكور؟","o":["البدية","جلفار","مليحة","البتراء"]},{"level":"سهل","key":"easy","q":"متى اكتشف علماء الآثار بقايا الحصن؟","o":["1999م","1421م","1507م","1619م"]},{"level":"سهل","key":"easy","q":"ما شكل الأبنية المكتشفة؟","o":["مربعة","دائرية","مثلثة","سداسية"]},{"level":"سهل","key":"easy","q":"كم يبلغ طول ضلع الأبنية تقريباً؟","o":["60 متراً","6 أمتار","160 متراً","600 متر"]},{"level":"سهل","key":"easy","q":"ما الذي عثر عليه العلماء إلى جانب الأبنية؟","o":["أبراج عالية","سفن خشبية","مخطوطات صينية","مقابر برجية"]},{"level":"متوسط","key":"medium","q":"لماذا ربط بعض العلماء الأبنية بالحصون البرتغالية؟","o":["بسبب شكلها المربع وأبراجها وقرائن المصادر","لأنها بنيت من الزجاج","لأنها تقع في الصحراء","لعدم وجود أي آثار"]},{"level":"متوسط","key":"medium","q":"ما سبب دمار بعض أجزاء الأبراج؟","o":["الجرافات وأعمال البناء الحديثة","الرياح الموسمية فقط","الزلازل القديمة فقط","الفيضانات البحرية"]},{"level":"متوسط","key":"medium","q":"ما فائدة التنقيب الأثري؟","o":["فحص البقايا للوصول إلى تفسير أدق للموقع","إخفاء البقايا","تغيير تاريخ الموقع","منع دراسة المصادر"]},{"level":"متوسط","key":"medium","q":"ماذا يقيس تاريخ الإشعاع الكربوني؟" out.push('<div class="exam-actions"><div class="timer" id="timer"><small>الوقت المتبقي</small><strong id="time">'+fmt(session.ends-Date.now())+'</strong></div><button class="btn danger" data-a="submit">تسليم</button></div></header>');
if(session.away)out.push('<div class="alert">⚠ <span><b>تم رصد مغادرة صفحة الاختبار.</b><br>عند العودة سيُحفظ وقت الغياب في سجل التفاعل.</span></div>');
out.push('<main class="exam-grid"><article class="reading"><div class="reading-head"><h2>'+esc(p.title)+'</h2><span>النص المرافق</span></div>');
out.push('<div class="reading-body">'+esc(p.text).split("\\n").join("<br><br>")+'</div></article>');
out.push('<section class="card question"><div class="question-top"><div><small>السؤال '+(session.current+1)+' من 15 · تمت الإجابة عن '+done+'</small><strong>اختاري إجابة واحدة</strong></div>');
out.push('<div class="actions"><span class="level '+x.key+'">'+x.level+'</span><button class="flag-btn '+(session.flags[session.current]?"on":"")+'" data-a="flag">⚑ '+(session.flags[session.current]?"معلّم":"للمراجعة")+'</button></div></div>');
out.push('<h1 class="qtext">'+esc(x.q)+'</h1><div class="options">');
out.push(x.o.map(function(o,i){return'<label class="option '+(ans===i?"selected":"")+'"><input type="radio" name="answer" value="'+i+'" '+(ans===i?"checked":"")+'><span class="letter">'+letters[i]+'</span><span>'+esc(o)+'</span></label>'}).join(""));
out.push('</div><div class="qbottom"><span class="save" id="save">تم الحفظ تلقائياً على هذا الجهاز</span><div class="nav-buttons"><button class="nav-btn" data-a="prev" '+(session.current===0?"disabled":"")+'>→ السابق</button><button class="nav-btn next" data-a="next">التالي ←</button></div></div></section></main></div><div id="modal"></div>');
app.innerHTML=out.join("");updateTimer();timer=setInterval(function(){if(active()){updateTimer();if(session.ends-Date.now()<=0)finish("انتهى الوقت")}},1000)}
function updateTimer(){let t=document.getElementById("time"),c=document.getElementById("timer");if(!t||!session)return;let n=session.ends-Date.now();t.textContent=fmt(n);c.classList.toggle("warn",n<300000&&n>60000);c.classList.toggle("critical",n<=60000)}
function selectAnswer(v){session.answers[session.current]=Number(v);save();document.querySelectorAll(".option").forEach(function(el,i){el.classList.toggle("selected",i===Number(v))});let s=document.getElementById("save");if(s)s.textContent="تم الحفظ الآن ✓";toast("تم حفظ الإجابة تلقائياً")}
function calculate(){return session&&session.result?session.result:null}
async function finish(reason){if(!session||session.submitted||submitting)return;if(!SECURE_API){toast("خدمة التصحيح الآمن غير مفعّلة.",true);return}submitting=true;if(session.away)back();try{await syncAttempt();let d=await api("/api/attempts/"+encodeURIComponent(session.attemptId)+"/submit",{method:"POST",body:JSON.stringify({answers:session.answers||{},events:session.events||[],reason:reason||"تم التسليم يدوياً"})});session.submitted=true;session.finished=Date.parse(d.submittedAt)||Date.now();session.reason=d.finishReason||reason;session.result=d.result||d;let h=hist().filter(function(x){return x.id!==session.id});h.unshift({id:session.id,name:session.name,passageTitle:currentPassage().title,date:session.finished,score:session.result.correct});try{localStorage.setItem(HISTORY,JSON.stringify(h.slice(0,30)))}catch(e){}localSave();screen="result";render()}catch(e){toast(e.message||"تعذر تسليم المحاولة. حاولي مع اتصال بالإنترنت.",true)}finally{submitting=false}}
function renderResult(reason){if(!session||session.submitted)return;if(session.away)back();session.submitted=true;session.finished=Date.now();session.reason=reason;session.result=calculate();let h=hist().filter(function(x){return x.id!==session.id});h.unshift({id:session.id,name:session.name,passageTitle:currentPassage().title,date:session.finished,score:session.result.correct});try{localStorage.setItem(HISTORY,JSON.stringify(h.slice(0,30)))}catch(e){}save();screen="result";render()}
function renderResult(){clearInterval(timer);let p=currentPassage(),r=session.result||{records:[],correct:0,blank:0,wrong:0,pct:0},by=["easy","medium","hard"].map(function(k){let a=r.records.filter(function(z){return(z.key||((qs()[z.index]||{}).key))===k}),n=a.filter(function(z){return z.ok}).length;return{label:(a[0]&&a[0].level)||({"easy":"سهل","medium":"متوسط","hard":"صعب"}[k]),n:n,p:a.length?Math.round(n/a.length*100):0}}),reviews=r.records.map(function(z,i){let q=qs()[z.index==null?i:z.index]||{},chosen=z.chosen==null?"لم تختاري إجابة":(q.o||[])[z.chosen]||"إجابة غير صالحة",correct=(q.o||[])[z.correctIndex]||"غير متاح",status=z.chosen==null?"blank":z.ok?"ok":"no";return'<details class="card review"><summary><span class="review-icon '+status+'">'+(z.chosen==null?"–":z.ok?"✓":"×")+'</span><span>س'+(i+1)+' · '+esc(z.level||q.level||"")+' · '+esc(q.q||"")+'</span></summary><div class="review-body"><div>إجابتك: <strong>'+esc(chosen)+'</strong></div><div>الصحيحة: <strong>'+esc(correct)+'</strong></div><p>'+esc(z.explanation||"")+'</p></div></details>'}).join(""),msg=r.pct>=80?"أداء رائع! واصلي التدريب.":r.pct>=60?"أداء جيد، راجعي الأسئلة الخاطئة.":"بداية مهمة، أعيدي قراءة النص ثم حاولي مرة أخرى.";app.innerHTML='<div class="results"><header class="top"><a class="brand" href="#" data-a="home"><span class="mark">م</span><span><strong>مِرْقاة</strong><small>تقرير المحاولة</small></span></a><div class="actions"><button class="btn secondary" data-a="print">طباعة</button><button class="btn primary" data-a="new">محاولة جديدة</button></div></header><div class="result-head"><div><h1>أحسنتِ يا '+esc(session.name)+'.</h1><p>'+esc(p.title)+' · '+esc(date(session.finished))+' · '+(session.reason==="انتهى الوقت"?"سُلّم تلقائياً لانتهاء الوقت":"سُلّم يدوياً")+'</p></div></div><section class="hero-result"><div class="ring" style="--pct:'+r.pct+'%"><div><b>'+r.pct+'%</b><small>النتيجة النهائية</small></div></div><div><h2>'+msg+'</h2><p>راجعي الإجابات والشرح بعد التسليم؛ التصحيح تم على الخادم.</p><span class="result-note">مغادرات الصفحة المسجلة: '+(r.exits==null?session.exits||0:r.exits)+'</span></div></section><section class="stats"><div class="card stat"><b>'+r.correct+'</b><small>إجابات صحيحة</small></div><div class="card stat"><b>'+r.wrong+'</b><small>تحتاج مراجعة</small></div><div class="card stat"><b>'+r.blank+'</b><small>بلا إجابة</small></div><div class="card stat"><b>'+duration((r.submittedAt?Date.parse(r.submittedAt):session.finished)-session.started)+'</b><small>الزمن المستخدم</small></div></section><section class="result-grid"><article class="card panel"><h3>الأداء حسب المستوى</h3>'+by.map(function(z){return'<div class="level-row"><b>'+z.label+'</b><div class="bar"><i style="width:'+z.p+'%"></i></div><span class="level-score">'+z.n+'/5</span></div>'}).join("")+'<p class="empty">يمكنك إعادة المحاولة بنص آخر من الصفحة الرئيسية.</p></article><article class="card panel"><h3>مراجعة الأسئلة والإجابات</h3><div class="reviews">'+reviews+'</div></article></section></div><div id="modal"></div>'}
function submitModal(){let n=Object.keys(session.answers).length;document.getElementById("modal").innerHTML='<div class="modal-bg"><section class="modal"><h3>تسليم الاختبار؟</h3><p>بعد التسليم سيظهر التقرير ولن تتمكني من تعديل هذه المحاولة.</p><div class="summary"><div><b>'+n+'</b><small>تمت الإجابة</small></div><div><b>'+ (15-n)+'</b><small>بلا إجابة</small></div><div><b>'+session.exits+'</b><small>مغادرات</small></div></div><div class="modal-actions"><button class="btn secondary" data-close>مراجعة</button><button class="btn primary" data-confirm-submit>تسليم الآن</button></div></section></div>'}
function back(){if(!session||!session.away)return;let now=Date.now(),last=session.events[session.events.length-1];if(last&&!last.returned){last.returned=now;last.duration=now-session.away}let d=now-session.away;session.away=null;save();if(screen==="exam"){renderExam();toast("تم تسجيل العودة. مدة الغياب: "+duration(d))}}
function leave(reason){if(!active()||session.away)return;session.away=Date.now();session.exits++;session.events.push({left:session.away,reason,returned:null,duration:0});save();let x=document.getElementById("exitCount");if(x)x.textContent=session.exits}
async function resumeAttempt(){if(!session||!session.attemptId)return;try{let d=await api("/api/attempts/"+encodeURIComponent(session.attemptId),{method:"GET"});session.answers=d.answers||{};session.flags=d.flags||{};session.events=d.events||[];session.exits=d.exits||0;session.started=Date.parse(d.startedAt)||session.started;session.ends=Date.parse(d.endsAt)||session.ends;if(d.status==="submitted"||d.status==="timed_out"){session.submitted=true;session.finished=Date.parse(d.submittedAt)||Date.now();session.result=d.result;session.reason=d.finishReason||"تم التسليم";localSave();screen="result";render()}else{session.submitted=false;screen="exam";localSave();render()}}catch(e){toast(e.message||"تعذر استئناف المحاولة.",true)}}
function render(){if(screen==="start")renderStart();else if(screen==="exam")renderExam();else renderResult()}
document.addEventListener("click",function(e){if(e.target.matches("[data-close]")){let m=document.getElementById("modal");if(m)m.innerHTML="";return}let b=e.target.closest("[data-a]");if(!b)return;e.preventDefault();let a=b.dataset.a;if(a==="home"){session=null;try{localStorage.removeItem(KEY)}catch(x){}renderStart()}else if(a==="resume"){resumeAttempt()}else if(a==="jump"){session.current=Number(b.dataset.i);save();render()}else if(a==="prev"){if(session.current>0){session.current--;save();render()}}else if(a==="next"){if(session.current<14){session.current++;save();render()}}else if(a==="flag"){session.flags[session.current]=!session.flags[session.current];save();render()}else if(a==="submit"){submitModal()}else if(a==="print"){window.print()}else if(a==="new"){try{localStorage.removeItem(KEY)}catch(x){}session=null;renderStart()}})
document.addEventListener("change",function(e){if(e.target.name==="answer")selectAnswer(e.target.value)})
document.addEventListener("submit",function(e){if(e.target.id!=="form")return;e.preventDefault();let name=document.getElementById("name").value.trim(),err=document.getElementById("err");if(!name){err.textContent="اكتبي اسم الطالبة أولاً.";return}if(!document.getElementById("agree").checked){err.textContent="يرجى تأكيد قراءة التعليمات.";return}start(name,Number(document.getElementById("mins").value),document.getElementById("passage").value)})
document.addEventListener("click",function(e){if(e.target.matches("[data-confirm-submit]")){let m=document.getElementById("modal");if(m)m.innerHTML="";finish("تم التسليم يدوياً")}})
document.addEventListener("visibilitychange",function(){if(!active())return;if(document.visibilityState==="hidden")leave("تبويب آخر أو صفحة غير ظاهرة");else{back();if(session.ends-Date.now()<=0)finish("انتهى الوقت")}})
window.addEventListener("pagehide",function(){leave("مغادرة أو إغلاق الصفحة")});window.addEventListener("beforeunload",function(){leave("تحديث أو إغلاق الصفحة")});window.addEventListener("online",function(){let x=document.getElementById("net");if(x){x.textContent="● متصلة";x.className="chip online"}});window.addEventListener("offline",function(){let x=document.getElementById("net");if(x){x.textContent="● دون اتصال";x.className="chip offline"}});render();
</script>
</body></html>
