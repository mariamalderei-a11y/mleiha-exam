const questions=[
{level:"سهل",key:"easy",q:"متى بُنيت قرية مليحة تقريباً؟",o:["حوالي 250 ق.م.","حوالي 250 م.","حوالي 2000 ق.م.","حوالي 1600 م."],a:0,e:"يذكر النص أن قرية مليحة بُنيت حوالي عام 250 قبل الميلاد، في بداية حقبة ما قبل الإسلام في الإمارات."},
{level:"سهل",key:"easy",q:"في أي حقبة تاريخية بُنيت قرية مليحة؟",o:["العصر الحديث","حقبة ما قبل الإسلام","العصر الروماني فقط","العصر الإسلامي المتأخر"],a:1,e:"يربط النص بناء القرية ببداية ما يسمى حقبة ما قبل الإسلام في الإمارات."},
{level:"سهل",key:"easy",q:"كم حجرة تتألف منها المقابر الأولى الموصوفة في النص؟",o:["حجرة واحدة","حجرتان","ثلاث حجرات","خمس حجرات"],a:0,e:"يصف النص المقابر بأنها تتألف من حجرة واحدة محفورة في الأرض."},
{level:"سهل",key:"easy",q:"على ماذا كان يقوم سقف المقابر؟",o:["أعمدة معدنية","عوارض خشبية","قِباب زجاجية","ألواح رخامية"],a:1,e:"يذكر النص أن سقف الحجرة كان يقوم على عوارض خشبية."},
{level:"سهل",key:"easy",q:"أين عُثر على العديد من المقابر التي يصفها النص؟",o:["مليحة","تدمر","البتراء","مدائن صالح"],a:0,e:"ينص المقطع على العثور على العديد من هذه المقابر في مليحة."},
{level:"متوسط",key:"medium",q:"إذا كان طول البرج 2م وعرضه 4.25م، فما محيط قاعدته المستطيلة؟",o:["6.25م","8.5م","12.5م","17م"],a:2,e:"محيط المستطيل = 2 × (الطول + العرض) = 2 × (2 + 4.25) = 12.5م."},
{level:"متوسط",key:"medium",q:"ما العبارة التي تميز مقابر مليحة وفق المقارنة الواردة في النص؟",o:["دُفن فيها عدد قليل من الأفراد غالباً","بُنيت كلها من الزجاج","تحتوي دائماً على مئات الهياكل","لا توجد فيها أي زخارف"],a:0,e:"يقارن النص بين مقابر مليحة التي دُفن فيها عدد قليل من الأفراد ومقابر أم النار ووادي سوق."},
{level:"متوسط",key:"medium",q:"بأي موقعين شُبّهت الزخارف المدرجة في الجزء العلوي من أبراج مقابر مليحة؟",o:["تدمر ومكة","البتراء ومدائن صالح","وادي سوق والعين","مصر وبلاد الرافدين"],a:1,e:"يشير النص إلى تشابه الزخارف مع مقابر الأنباط في البتراء ومدائن صالح."},
{level:"متوسط",key:"medium",q:"إلى ماذا تشير أوجه الشبه بين مقابر مليحة وبعض المواقع العربية؟",o:["إلى عزلة مليحة عن المنطقة","إلى علاقات متزايدة بين الإمارات والمنطقة العربية","إلى أن المقابر حديثة البناء","إلى اختلاف الزخارف تماماً"],a:1,e:"يخلص النص إلى أن التشابه يشير إلى علاقات متزايدة بين الإمارات والمنطقة العربية."},
{level:"متوسط",key:"medium",q:"بأي نوع من الكتابة كُتب النقش المكتشف على أحد المدافن البرجية؟",o:["الأبجدية العربية الجنوبية","الأبجدية اللاتينية","الخط المسماري","الرموز الفرعونية"],a:0,e:"ذكر النص أن النقش كُتب بحروف الأبجدية العربية الجنوبية المستخدمة على نطاق واسع آنذاك."},
{level:"صعب",key:"hard",q:"إذا افترضنا أن البرج متوازي مستطيلات، فما حجمه بأبعاده: 2م طولاً، 4.25م عرضاً، و3.5م ارتفاعاً؟",o:["9.75م³","14.875م³","29.75م³","42.5م³"],a:2,e:"الحجم = الطول × العرض × الارتفاع = 2 × 4.25 × 3.5 = 29.75م³."},
{level:"صعب",key:"hard",q:"ما الاستنتاج الأقرب بسبب العثور على عدد قليل من الهياكل العظمية في حجرات المقابر؟",o:["ربما كانت جثة الميت توضع في البرج فوق سطح الأرض","كانت المقابر خالية دائماً من الموتى","بُنيت المقابر تحت البحر","لم تكن للمقابر علاقة بالدفن"],a:0,e:"يربط النص بين قلة الهياكل العظمية واحتمال وضع جثة الميت في البرج فوق سطح الأرض."},

const passage="مليحة والمنطقة العربية\n\nبُنيت قرية مليحة حوالي عام (250) ق.م. أي في بداية ما يسمى حقبة ما قبل الإسلام في الإمارات. ومن أبرز الأدلة الأولى على تلك الحقبة التاريخية مقابر رائعة التصميم تتألف من حجرة واحدة حفرت في الأرض ويقوم سقفها على عوارض خشبية، وينتصب على سقف المقابر برج كبير من الطوب بطول (2) متر وعرض (4.25) متر ويبلغ ارتفاعه (3.5) متر. يزدان الوجه العلوي للبرج بزخارف مدرجة مصنوعة من الحجارة أو الجص الذي كان متوفراً في البيئة المحلية. تم العثور على العديد من هذه المقابر في مليحة، كما يتم الكشف عن المزيد منها من خلال أعمال التنقيب الحالية التي تقوم بها هيئة الشارقة للآثار.\n\nلا يشبه شكل تلك المقابر أية مقابر أخرى في تاريخ دولة الإمارات العربية المتحدة. تضم مقابر حضارة أم النار (2500-2000) ق.م ووادي سوق (2000-1600) ق.م بقايا رفات عشرات الأشخاص، على خلاف معظم مقابر مليحة التي دُفن فيها عدد قليل من الأفراد. تم العثور على عدد قليل من الهياكل العظمية في حجرات تلك المقابر، ما يزيد من احتمال أن جثة الميت كانت توضع في البرج فوق سطح الأرض.\n\nتشبه المقابر المكتشفة في مليحة إلى حد ما المقابر الموجودة في بقية مناطق الشرق الأوسط بما في ذلك مدينة تدمر الأثرية الشهيرة في سوريا، كما أن الزخارف المدرجة التي تزين الجزء العلوي من أبراج مقابر مليحة تشبه مقابر مملكة الأنباط العربية الشهيرة في مدينة البتراء الأثرية في الأردن ومدائن صالح في السعودية. تشير أوجه الشبه هذه إلى وجود علاقات متزايدة بين الإمارات والمنطقة العربية.\n\nلا تقتصر دلائل هذه العلاقات على المدافن، إذ تدل العديد من النقوش المهمة التي تم العثور عليها في مليحة عن اتصال مليحة مع بقية المنطقة العربية، فقد اكتشف علماء الآثار نقشاً على أحد المدافن البرجية كتب بحروف الأبجدية العربية الجنوبية التي كانت مستخدمة على نطاق واسع في اليمن في ذلك الوقت. يقول النقش: «نفس وقبر ذرية فتى لملوك» وترجمته: «هذا برج وقبر ذرية خادم الملوك». وكلمة «نفس» هي على الأغلب مشتقة من اللغة الآرامية، ما يشير إلى أن هذا الجزء من المنطقة العربية قد تأثر بالعديد من المناطق.";
let session=load(),view=session&&session.submitted?"result":"start",timer;
const app=document.getElementById("app");
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(session))}catch(e){}}
function history(){try{return JSON.parse(localStorage.getItem(HISTORY)||"[]")}catch(e){return[]}}
function fmt(ms){let s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60),h=Math.floor(m/60);s%=60;m%=60;return (h?String(h).padStart(2,"0")+":" : "")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function duration(ms){let s=Math.round(Math.max(0,ms)/1000);return s<60?s+" ثانية":Math.floor(s/60)+" دقيقة"+(s%60?" و"+s%60+" ثانية":"")}
function date(x){try{return new Intl.DateTimeFormat("ar-EG",{dateStyle:"medium",timeStyle:"short"}).format(new Date(x))}catch(e){return new Date(x).toLocaleString("ar-EG")}}
function modal(content){document.getElementById("modal").innerHTML='<div class="modal-bg" data-close><section class="modal">'+content+'</section></div>'}
function closeModal(){let x=document.getElementById("modal");if(x)x.innerHTML=""}
function toast(message,bad){let old=document.getElementById("toast");if(old)old.remove();let x=document.createElement("div");x.id="toast";x.className="toast"+(bad?" bad":"");x.textContent=message;document.body.appendChild(x);setTimeout(()=>x.remove(),3300)}
function start(name,mins){let now=Date.now();session={id:"a"+now,name:name.trim(),started:now,ends:now+mins*60000,current:0,answers:{},flags:{},exits:0,away:null,events:[],submitted:false,result:null};view="exam";save();render()}
function active(){return view==="exam"&&session&&!session.submitted}
function q(){return questions[session.current]}
function renderStart(){clearInterval(timer);view="start";let h=history(),a=session&&!session.submitted?session:null;app.innerHTML=`<div class="wrap"><header class="top"><a class="brand" href="#" data-a="home"><span class="mark">م</span><span><strong>مِرْقاة</strong><small>تعلّمي، تدرّبي، وتقدّمي</small></span></a><div><button class="btn ghost" data-a="source">النص المعتمد</button><button class="btn ghost" data-a="help">كيف يعمل؟</button></div></header><main><section class="start-grid"><section class="hero"><span class="eyebrow">اختبار فهم مقروء ذكي</span><h1>اجعلي كل سؤال خطوة إلى الأمام.</h1><p>تدريب تفاعلي مبني على فقرة «مليحة والمنطقة العربية»، يضم 15 سؤالاً على ثلاثة مستويات مع مؤقت وتصحيح مفصل.</p><div class="pills"><span class="pill">15 سؤالاً</span><span class="pill">5 سهل + 5 متوسط + 5 صعب</span><span class="pill">حفظ تلقائي</span></div><div class="ready"><i></i>النظام جاهز لبدء محاولة جديدة</div></section><section><form class="card setup" id="form"><h2>ابدئي جلستك التدريبية</h2><p>اكتبي اسم الطالبة واقرئي التعليمات قبل البدء.</p><div class="field"><label for="name">اسم الطالبة</label><input id="name" maxlength="60" placeholder="مثال: سارة أحمد" required></div><div class="row"><div class="field"><label for="mins">مدة الاختبار</label><select id="mins"><option value="15">15 دقيقة</option><option value="20">20 دقيقة</option><option value="30">30 دقيقة</option></select></div><div class="field"><label>توزيع الأسئلة</label><select disabled><option>متدرج حسب الصعوبة</option></select></div></div><div class="err" id="err"></div><label class="check"><input id="agree" type="checkbox"><span>أفهم أن مغادرة صفحة الاختبار قد تُسجّل، وأن الإجابات تُحفظ تلقائياً على هذا الجهاز.</span></label><button class="btn primary full">ابدئي الاختبار ←</button><div class="note"><b>ⓘ</b><span>لا يمكن للمتصفح ضمان اكتشاف إغلاق الجهاز أو انقطاع الشبكة 100%؛ لذلك يستخدم مؤشرات الصفحة والحفظ الدوري.</span></div></form>${a?`<div class="card resume"><div class="resume-head"><strong>لديك محاولة غير مكتملة</strong><span class="resume-tag">قابلة للاستئناف</span></div><div class="resume-info"><span>الطالبة: <b>${esc(a.name)}</b></span><span>الإجابات: <b>${Object.keys(a.answers).length}/15</b></span><span>المتبقي: <b>${fmt(a.ends-Date.now())}</b></span></div><div class="actions"><button class="btn primary" data-a="resume">استئناف</button><button class="btn secondary" data-a="discard">بدء جديدة</button></div></div>`:""}</section></section><section class="features"><article class="card feature"><span class="ico">⏱</span><strong>مؤقت واضح</strong><p>يستمر الوقت حتى عند تحديث الصفحة ويسلّم الاختبار تلقائياً عند انتهائه.</p></article><article class="card feature"><span class="ico">✓</span><strong>تصحيح مفصل</strong><p>تظهر النتيجة والإجابة الصحيحة وشرح مختصر بعد التسليم.</p></article><article class="card feature"><span class="ico">◌</span><strong>سجل مغادرة شفاف</strong><p>يظهر عدد المغادرات ومدة الغياب للطالبة بوضوح.</p></article></section><section class="card history"><div class="section-head"><h3>آخر المحاولات على هذا الجهاز</h3><small>${h.length} محاولة</small></div><div class="history-list">${h.length?h.slice(0,4).map(x=>`<div class="history-item"><span><b>${esc(x.name)}</b><small>${esc(date(x.date))}</small></span><span class="score">${x.score}/15</span></div>`).join(""):"<span class='empty'>لا توجد محاولات محفوظة بعد.</span>"}</div></section></main></div><div id="modal"></div>`}
function renderExam(){clearInterval(timer);view="exam";let x=q(),ans=session.answers[session.current],done=Object.keys(session.answers).length;app.innerHTML=`<div class="exam"><header class="exam-top"><div class="exam-title"><span class="mark">م</span><span>مِرْقاة / الاختبار التدريبي</span></div><div class="meta"><button class="btn blue-soft" data-a="source">النص المعتمد</button><span class="chip">الطالبة: ${esc(session.name)}</span><span class="chip ${navigator.onLine?"online":"offline"}" id="net">● ${navigator.onLine?"متصلة":"دون اتصال"}</span><span class="chip exits">مغادرات: <b id="exitCount">${session.exits}</b></span></div><div class="exam-actions"><div class="timer" id="timer"><small>الوقت المتبقي</small><strong id="time">${fmt(session.ends-Date.now())}</strong></div><button class="btn danger" data-a="submit">تسليم</button></div></header>${session.away?`<div class="alert">⚠ <span><b>تم رصد مغادرة صفحة الاختبار.</b><br>عند العودة سيُحفظ وقت الغياب في سجل التفاعل.</span></div>`:""}<main class="exam-grid"><aside class="card nav"><h2>خريطة الأسئلة</h2><p>السؤال ${session.current+1} من 15 · تمت الإجابة عن ${done}</p><div class="qgrid">${questions.map((z,i)=>`<button class="qnum ${i===session.current?"current":""} ${session.answers[i]!=null?"done":""} ${session.flags[i]?"flag":""}" data-a="jump" data-i="${i}">${i+1}</button>`).join("")}</div><div class="legend"><div><span class="done"></span>تمت الإجابة</div><div><span></span>لم تتم الإجابة</div></div><div class="progress"><span>التقدم</span><b>${Math.round(done/15*100)}%</b></div></aside><section class="card question"><div class="question-top"><div><small>السؤال ${session.current+1} من 15</small><strong>اختاري إجابة واحدة</strong></div><div class="actions"><span class="level ${x.key}">${x.level}</span><button class="flag-btn ${session.flags[session.current]?"on":""}" data-a="flag">⚑ ${session.flags[session.current]?"معلّم":"للمراجعة"}</button></div></div><h1 class="qtext">${esc(x.q)}</h1><div class="options">${x.o.map((o,i)=>`<label class="option ${ans===i?"selected":""}"><input type="radio" name="answer" value="${i}" ${ans===i?"checked":""}><span class="letter">${letters[i]}</span><span>${esc(o)}</span></label>`).join("")}</div><div class="qbottom"><span class="save" id="save">تم الحفظ تلقائياً على هذا الجهاز</span><div class="nav-buttons"><button class="nav-btn" data-a="prev" ${session.current===0?"disabled":""}>→ السابق</button><button class="nav-btn next" data-a="next">التالي ←</button></div></div></section></main></div><div id="modal"></div>`;updateTimer();timer=setInterval(()=>{if(active()){updateTimer();if(session.ends-Date.now()<=0)finish("انتهى الوقت")}},1000)}
function updateTimer(){let t=document.getElementById("time"),c=document.getElementById("timer");if(!t||!session)return;let n=session.ends-Date.now();t.textContent=fmt(n);c.classList.toggle("warn",n<300000&&n>60000);c.classList.toggle("critical",n<=60000)}
function selectAnswer(v){session.answers[session.current]=Number(v);save();document.querySelectorAll(".option").forEach((el,i)=>el.classList.toggle("selected",i===Number(v)));document.querySelector("#save").textContent="تم الحفظ الآن ✓";document.querySelectorAll(".qnum")[session.current].classList.add("done");toast("تم حفظ الإجابة تلقائياً")}
function result(){let records=questions.map((x,i)=>({x:x,chosen:session.answers[i],ok:session.answers[i]===x.a})),correct=records.filter(x=>x.ok).length,blank=records.filter(x=>x.chosen==null).length;return{records:records,correct:correct,blank:blank,wrong:15-correct-blank,pct:Math.round(correct/15*100)}}
function levelScores(){return ["easy","medium","hard"].map(k=>session.result.records.filter(z=>z.x.key===k&&z.ok).length)}
function teacherPayload(eventType){
  let r=session.result||result(),levels=levelScores();
  let awaySeconds=session.events.reduce((n,e)=>n+Math.round((e.duration||0)/1000),0);
  return {eventType,attemptId:session.id,studentName:session.name,startedAt:new Date(session.started).toISOString(),lastSeenAt:new Date().toISOString(),submittedAt:session.finished?new Date(session.finished).toISOString():"",status:eventType==="submitted"?"مُسلّمة":"خارج الموقع",score:r.correct,percentage:r.pct,easyScore:levels[0],mediumScore:levels[1],hardScore:levels[2],exits:session.exits,awaySeconds,finishReason:session.reason||"",events:session.events};
}
function sendToTeacher(eventType,urgent){
  if(!SUBMIT_ENDPOINT||!session)return;
  let body=JSON.stringify(teacherPayload(eventType));
  try{
    if(urgent&&navigator.sendBeacon){navigator.sendBeacon(SUBMIT_ENDPOINT,new Blob([body],{type:"text/plain;charset=UTF-8"}));return}
    fetch(SUBMIT_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body,keepalive:true}).catch(()=>{});
  }catch(e){}
}
function finish(reason){if(!session||session.submitted)return;if(session.away)back();session.submitted=true;session.finished=Date.now();session.reason=reason;session.result=result();let h=history().filter(x=>x.id!==session.id);h.unshift({id:session.id,name:session.name,date:session.finished,score:session.result.correct});try{localStorage.setItem(HISTORY,JSON.stringify(h.slice(0,20)))}catch(e){}save();sendToTeacher("submitted",false);view="result";render()}
function renderResult(){clearInterval(timer);let r=session.result||result(),by=["easy","medium","hard"].map(k=>{let a=r.records.filter(z=>z.x.key===k),n=a.filter(z=>z.ok).length;return{label:a[0].x.level,n:n,p:a.length?Math.round(n/a.length*100):0}});let reviews=r.records.map((z,i)=>{let status=z.chosen==null?"blank":z.ok?"ok":"no",chosen=z.chosen==null?"لم تختاري إجابة":z.x.o[z.chosen];return`<details class="card review"><summary><span class="review-icon ${status}">${z.chosen==null?"–":z.ok?"✓":"×"}</span><span>س${i+1} · ${z.x.level} · ${esc(z.x.q)}</span></summary><div class="review-body"><div>إجابتك: <strong>${esc(chosen)}</strong></div><div>الصحيحة: <strong>${esc(z.x.o[z.x.a])}</strong></div><p>${esc(z.x.e)}</p></div></details>`}).join("");let msg=r.pct>=80?"أداء رائع! واصلي التدريب.":r.pct>=60?"أداء جيد، راجعي الأسئلة الخاطئة.":"بداية مهمة، أعيدي قراءة الفقرة ثم حاولي مرة أخرى.";app.innerHTML=`<div class="results"><header class="top"><a class="brand" href="#" data-a="home"><span class="mark">م</span><span><strong>مِرْقاة</strong><small>تقرير المحاولة</small></span></a><div class="actions"><button class="btn secondary" data-a="print">طباعة</button><button class="btn secondary" data-a="form">إرسال النتيجة للمعلمة</button><button class="btn primary" data-a="new">محاولة جديدة</button></div></header><div class="result-head"><div><h1>أحسنتِ يا ${esc(session.name)}.</h1><p>${esc(date(session.finished))} · ${session.reason==="انتهى الوقت"?"سُلّم تلقائياً لانتهاء الوقت":"سُلّم يدوياً"}</p></div></div><section class="hero-result"><div class="ring" style="--pct:${r.pct}%"><div><b>${r.pct}%</b><small>النتيجة النهائية</small></div></div><div><h2>${msg}</h2><p>راجعي الإجابات والشرح؛ كل مستوى يحتوي على خمسة أسئلة مبنية على فقرة مليحة والمنطقة العربية.</p><span class="result-note">مغادرات الصفحة المسجلة: ${session.exits}</span></div></section><section class="stats"><div class="card stat"><b>${r.correct}</b><small>إجابات صحيحة</small></div><div class="card stat"><b>${r.wrong}</b><small>تحتاج مراجعة</small></div><div class="card stat"><b>${r.blank}</b><small>بلا إجابة</small></div><div class="card stat"><b>${duration(session.finished-session.started)}</b><small>الزمن المستخدم</small></div></section><section class="result-grid"><article class="card panel"><h3>الأداء حسب المستوى</h3>${by.map(z=>`<div class="level-row"><b>${z.label}</b><div class="bar"><i style="width:${z.p}%"></i></div><span class="level-score">${z.n}/5</span></div>`).join("")}<p class="empty">استخدمي النتيجة لتحديد أولوية المراجعة.</p></article><article class="card panel"><h3>مراجعة الأسئلة والإجابات</h3><div class="reviews">${reviews}</div></article></section></div><div id="modal"></div>`}
function help(){modal(`<h3>كيف يعمل الموقع؟</h3><p>نسخة تفاعلية مبنية على الفقرة المرفقة عن مليحة والمنطقة العربية.</p><ul class="help-list"><li>15 سؤالاً: 5 سهلة، 5 متوسطة، 5 صعبة.</li><li>حفظ تلقائي واستئناف بعد تحديث الصفحة.</li><li>تسجيل مغادرة الصفحة ومدة الغياب عند العودة.</li><li>تصحيح فوري مع شرح لكل سؤال.</li><li>للربط مع لوحة معلمة مركزية يلزم خادم وقاعدة بيانات.</li></ul><div class="modal-actions"><button class="btn primary" data-close-button>فهمت</button></div>`)}
function source(){modal(`<h3>النص المعتمد للأسئلة</h3><p>يمكن الرجوع إلى الفقرة أثناء التدريب.</p><div class="source">${esc(passage)}</div><div class="modal-actions"><button class="btn primary" data-close-button>إغلاق</button></div>`)}
function submitModal(){let n=Object.keys(session.answers).length;modal(`<h3>تسليم الاختبار؟</h3><p>بعد التسليم سيظهر التقرير ولن تتمكني من تعديل هذه المحاولة.</p><div class="summary"><div><b>${n}</b><small>تمت الإجابة</small></div><div><b>${15-n}</b><small>بلا إجابة</small></div><div><b>${session.exits}</b><small>مغادرات</small></div></div><div class="modal-actions"><button class="btn secondary" data-close-button>مراجعة</button><button class="btn primary" data-confirm-submit>تسليم الآن</button></div>`)}
function render(){if(view==="start")renderStart();else if(view==="exam")renderExam();else renderResult()}
document.addEventListener("click",e=>{if(e.target.matches("[data-close]")||e.target.matches("[data-close-button]")){closeModal();return}let b=e.target.closest("[data-a]");if(!b)return;e.preventDefault();let a=b.dataset.a;if(a==="home"){renderStart()}else if(a==="help"){help()}else if(a==="source"){source()}else if(a==="resume"){if(session.ends>Date.now()){if(session.away)back();view="exam";render();toast("تم استئناف المحاولة") }else finish("انتهى الوقت")}else if(a==="discard"){modal(`<h3>بدء محاولة جديدة؟</h3><p>سيتم حذف المحاولة غير المكتملة من هذا الجهاز.</p><div class="modal-actions"><button class="btn secondary" data-close-button>إلغاء</button><button class="btn danger" data-confirm-discard>حذف وبدء</button></div>`)}else if(a==="jump"){session.current=Number(b.dataset.i);save();render()}else if(a==="prev"){if(session.current>0){session.current--;save();render()}}else if(a==="next"){if(session.current<14){session.current++;save();render()}}else if(a==="flag"){session.flags[session.current]=!session.flags[session.current];save();render()}else if(a==="submit"){submitModal()}else if(a==="print"){window.print()}else if(a==="form"){window.open(FORM_URL,"_blank","noopener")}else if(a==="new"){try{localStorage.removeItem(KEY)}catch(e){}session=null;renderStart()}});
document.addEventListener("change",e=>{if(e.target.name==="answer")selectAnswer(e.target.value)});
document.addEventListener("submit",e=>{if(e.target.id!=="form")return;e.preventDefault();let name=document.getElementById("name").value.trim(),err=document.getElementById("err");if(!name){err.textContent="اكتبي اسم الطالبة أولاً.";return}if(!document.getElementById("agree").checked){err.textContent="يرجى تأكيد قراءة التعليمات.";return}start(name,Number(document.getElementById("mins").value))});
document.addEventListener("click",e=>{if(e.target.matches("[data-confirm-submit]")){closeModal();finish("تم التسليم يدوياً")}if(e.target.matches("[data-confirm-discard]")){closeModal();try{localStorage.removeItem(KEY)}catch(x){}session=null;renderStart()}});
function leave(reason){if(!active()||session.away)return;session.away=Date.now();session.exits++;session.events.push({left:session.away,reason,returned:null,duration:0});save();sendToTeacher("left",true);let x=document.getElementById("exitCount");if(x)x.textContent=session.exits}
function back(){if(!session||!session.away)return;let now=Date.now(),last=session.events[session.events.length-1];if(last&&!last.returned){last.returned=now;last.duration=now-session.away}let d=now-session.away;session.away=null;save();if(view==="exam"){renderExam();toast("تم تسجيل العودة. مدة الغياب: "+duration(d))}}
document.addEventListener("visibilitychange",()=>{if(!active())return;if(document.visibilityState==="hidden")leave("تبويب آخر أو صفحة غير ظاهرة");else{back();if(session.ends-Date.now()<=0)finish("انتهى الوقت")}});window.addEventListener("pagehide",()=>leave("مغادرة أو إغلاق الصفحة"));window.addEventListener("beforeunload",()=>leave("تحديث أو إغلاق الصفحة"));window.addEventListener("online",()=>{let x=document.getElementById("net");if(x){x.textContent="● متصلة";x.className="chip online"}});window.addEventListener("offline",()=>{let x=document.getElementById("net");if(x){x.textContent="● دون اتصال";x.className="chip offline"}});render();
</script></body></html>
